name: Auth65 normal lock measurement (temporary)

on:
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/auth65-lock-prune.yml

permissions:
  contents: read
  actions: read

jobs:
  measure:
    if: github.event.pull_request.head.repo.full_name == 'askrjs/askr-auth'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Select Node 24.21.0 with its bundled npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.21.0"
      - name: Measure the exact reviewed source using ordinary npm
        shell: bash
        env:
          NODE_DISABLE_COMPILE_CACHE: "1"
          LOCK_PRUNE_ROOT: ${{ runner.temp }}/auth65-lock-prune-${{ github.run_id }}-${{ github.run_attempt }}
          LOCK_BINDING_JSON: |
            {
              "schemaVersion": 1,
              "repository": "askrjs/askr-auth",
              "sourceCommitX": "4f8736a6d81a05f140a94482ee8c50cbee5b6f0a",
              "sourceTree": "c3a7617648235502ccf734839cbfae4e7998ed72",
              "packageSha256": "fda7cb22d0e940c0c8df81d7c7ea43f11751c9fa2c9811752d5eb784538d7ec1",
              "oldLockSha256": "e7f13eda261c7aebc73f14bf67e4215cb1c8a4a141ccb43c546cd3aeaf648986",
              "measurementCommitY": "9c3e8175324e35908ce42dd7e3e71487d424fa96",
              "measurementTree": "858b67d52439c3850a90bb9ed0dac8e324e7d2b3",
              "helperSha256": "25dd7465db9d9aa57eadfa0bbe21475f8ba5b54e8f12f47b459abf20d4cdcdf4",
              "carryForwardReviewSha256": "31363ab5b29ec5c0dd39fa7601b5b143c6455238302eac32e4590ecb906111be",
              "oldTestDeletionReviewSha256": "9c37457d42d993d6d492401562a11ab04e42b8494593b72f16f4e0765eaa6cfa",
              "carryForwardGreen": true,
              "oldTestDeletionApproved": true
            }
          LOCK_GITHUB_JSON: >-
            {"eventName":"${{ github.event_name }}","repository":"${{ github.repository }}","headRepository":"${{ github.event.pull_request.head.repo.full_name }}","requestedHeadZ":"${{ github.event.pull_request.head.sha }}","workflowCommit":"${{ github.workflow_sha }}","workflowRef":"${{ github.workflow_ref }}","githubSha":"${{ github.sha }}","runId":"${{ github.run_id }}","runAttempt":"${{ github.run_attempt }}","runnerOs":"${{ runner.os }}","runnerArch":"${{ runner.arch }}"}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { spawnSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import {
            lstatSync,
            mkdirSync,
            readFileSync,
            readdirSync,
            statfsSync,
            writeFileSync,
          } from "node:fs";
          import { join, resolve } from "node:path";

          export function validateBootstrap(binding, github) {
            assert.equal(binding?.schemaVersion, 1);
            assert.equal(binding.repository, "askrjs/askr-auth");
            for (const key of ["sourceCommitX", "sourceTree", "measurementCommitY", "measurementTree"])
              assert.ok(
                typeof binding[key] === "string" &&
                  /^[0-9a-f]{40}$/u.test(binding[key]) &&
                  !/^0+$/u.test(binding[key]),
                "Unbound literal " + key,
              );
            for (const key of [
              "packageSha256",
              "oldLockSha256",
              "helperSha256",
              "carryForwardReviewSha256",
              "oldTestDeletionReviewSha256",
            ])
              assert.ok(
                typeof binding[key] === "string" &&
                  /^[0-9a-f]{64}$/u.test(binding[key]) &&
                  !/^0+$/u.test(binding[key]),
                "Unbound literal " + key,
              );
            assert.equal(binding.carryForwardGreen, true);
            assert.equal(binding.oldTestDeletionApproved, true);
            assert.equal(github.eventName, "pull_request");
            assert.equal(github.repository, "askrjs/askr-auth");
            assert.equal(github.headRepository, "askrjs/askr-auth");
            for (const key of ["requestedHeadZ", "workflowCommit"])
              assert.ok(typeof github[key] === "string" && /^[0-9a-f]{40}$/u.test(github[key]));
          }

          export function bootstrap() {
            const root = resolve(process.env.LOCK_PRUNE_ROOT);
            assert.ok(root.startsWith(resolve(process.env.RUNNER_TEMP) + "/"));
            mkdirSync(root, { mode: 0o700 });
            const evidence = join(root, "evidence");
            mkdirSync(evidence, { mode: 0o700 });
            const receipt = {
              startedAt: new Date().toISOString(),
              commands: [],
              status: "STARTED",
              node: process.version,
              platform: process.platform,
            };
            const save = () =>
              writeFileSync(join(evidence, "bootstrap.json"), JSON.stringify(receipt, null, 2) + "\n", {
                mode: 0o600,
              });
            try {
              const binding = JSON.parse(process.env.LOCK_BINDING_JSON);
              const github = JSON.parse(process.env.LOCK_GITHUB_JSON);
              receipt.binding = binding;
              receipt.github = github;
              save();
              validateBootstrap(binding, github);
              assert.equal(process.version, "v24.21.0");
              assert.equal(process.platform, "linux");
              const stat = statfsSync(root);
              receipt.freeBytesBeforeFetch = stat.bavail * stat.bsize;
              assert.ok(
                receipt.freeBytesBeforeFetch >= 8 * 1024 ** 3,
                "At least 8 GiB before fetching is mandatory.",
              );
              const home = join(root, "bootstrap-home");
              mkdirSync(home, { mode: 0o700 });
              const gitConfig = join(home, "gitconfig");
              writeFileSync(gitConfig, "", { mode: 0o600 });
              const env = {
                PATH: process.env.PATH,
                HOME: home,
                GIT_CONFIG_GLOBAL: gitConfig,
                GIT_CONFIG_NOSYSTEM: "1",
                GIT_TERMINAL_PROMPT: "0",
              };
              const code = join(root, "code");
              mkdirSync(code, { mode: 0o700 });
              function git(args) {
                const result = spawnSync("git", args, {
                  cwd: code,
                  env,
                  encoding: "utf8",
                  timeout: 120000,
                  maxBuffer: 16 * 1024 * 1024,
                });
                receipt.commands.push({
                  executable: "git",
                  args,
                  status: result.status,
                  signal: result.signal,
                  stdout: result.stdout,
                  stderr: result.stderr,
                  error: result.error?.message ?? null,
                });
                save();
                assert.ok(
                  result.status === 0 && result.signal === null && !result.error,
                  "Anonymous public Git fetch/checkout failed.",
                );
              }
              git(["init", "--quiet"]);
              git(["remote", "add", "origin", "https://github.com/askrjs/askr-auth.git"]);
              for (const commit of [
                ...new Set([
                  binding.sourceCommitX,
                  binding.measurementCommitY,
                  github.requestedHeadZ,
                  github.workflowCommit,
                ]),
              ])
                git(["fetch", "--no-tags", "--depth=2", "origin", commit]);
              git(["checkout", "--quiet", "--detach", binding.measurementCommitY]);
              const helper = join(code, "release/auth65-lock-prune/measure.mjs");
              const helperBytes = readFileSync(helper);
              assert.equal(
                createHash("sha256").update(helperBytes).digest("hex"),
                binding.helperSha256,
                "Only the independently reviewed helper Y may execute.",
              );
              git(["worktree", "add", "--detach", join(root, "source"), binding.sourceCommitX]);
              receipt.status = "PUBLIC_IDENTITIES_FETCHED_HELPER_HASH_VERIFIED";
              save();
              const measured = spawnSync(process.execPath, [helper], {
                cwd: code,
                env: {
                  ...env,
                  RUNNER_TEMP: process.env.RUNNER_TEMP,
                  LOCK_PRUNE_ROOT: root,
                  LOCK_BINDING_JSON: JSON.stringify(binding),
                  LOCK_GITHUB_JSON: JSON.stringify(github),
                  NODE_DISABLE_COMPILE_CACHE: "1",
                },
                encoding: "utf8",
                timeout: 18 * 60 * 1000,
                maxBuffer: 16 * 1024 * 1024,
              });
              writeFileSync(join(evidence, "measurement-driver.stdout.log"), measured.stdout ?? "", {
                mode: 0o600,
              });
              writeFileSync(join(evidence, "measurement-driver.stderr.log"), measured.stderr ?? "", {
                mode: 0o600,
              });
              receipt.measurement = {
                status: measured.status,
                signal: measured.signal,
                error: measured.error?.message ?? null,
              };
              assert.ok(
                measured.status === 0 && measured.signal === null && !measured.error,
                "Measurement failed; generated lock is not admitted.",
              );
              receipt.status = "MEASUREMENT_COMPLETED_NOT_ADOPTED";
            } catch (error) {
              receipt.status = "BOOTSTRAP_OR_MEASUREMENT_FAILED_NOT_ADOPTED";
              receipt.error = { name: error.name, message: error.message, stack: error.stack };
              process.exitCode = 1;
            } finally {
              receipt.completedAt = new Date().toISOString();
              const finalStat = statfsSync(root);
              receipt.freeBytesAfter = finalStat.bavail * finalStat.bsize;
              if (receipt.freeBytesAfter < 8 * 1024 ** 3) {
                receipt.status = "FINAL_CAPACITY_FAILED_NOT_ADOPTED";
                process.exitCode = 1;
              }
              save();
              const files = {};
              function retain(directory, prefix = "") {
                for (const name of readdirSync(directory).sort()) {
                  const file = join(directory, name);
                  const relative = prefix ? prefix + "/" + name : name;
                  if (lstatSync(file).isDirectory()) retain(file, relative);
                  else if (relative !== "artifact-files.json") {
                    const bytes = readFileSync(file);
                    files[relative] = {
                      sha256: createHash("sha256").update(bytes).digest("hex"),
                      size: bytes.length,
                    };
                  }
                }
              }
              retain(evidence);
              writeFileSync(join(evidence, "artifact-files.json"), JSON.stringify(files, null, 2) + "\n", {
                mode: 0o600,
              });
            }
          }

          bootstrap();

          NODE
      - name: Retain generated lock and raw evidence (no adoption)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: auth65-lock-measurement-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/auth65-lock-prune-${{ github.run_id }}-${{ github.run_attempt }}/evidence/
          if-no-files-found: error
          retention-days: 7
